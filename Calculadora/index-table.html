<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Calculadora - Tabla HTML</title>

  <link rel="stylesheet" href="css/calculator-base.css">
  <link rel="stylesheet" href="css/calculator-table.css">
</head>

<body>

  <main class="calculator">

    <div id="display" class="display" aria-live="polite"> 0 </div>

    <table class="keypad">
      <tr>
        <td><button type="button" class="btn btn-action" data-action="clear-all">AC</button></td>
        <td><button type="button" class="btn btn-action" data-action="clear-entry">CE</button></td>
        <td><button type="button" class="btn btn-operator" data-action="percent" aria-label="Porcentaje">%</button></td>
        <td><button type="button" class="btn btn-operator" data-action="operator" data-value="/" aria-label="Dividir">÷</button></td>
      </tr>

      <tr>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="7">7</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="8">8</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="9">9</button></td>
        <td><button type="button" class="btn btn-operator" data-action="operator" data-value="*" aria-label="Multiplicar">×</button></td>
      </tr>

      <tr>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="4">4</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="5">5</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="6">6</button></td>
        <td><button type="button" class="btn btn-operator" data-action="operator" data-value="-" aria-label="Restar">-</button></td>
      </tr>

      <tr>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="1">1</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="2">2</button></td>
        <td><button type="button" class="btn btn-digit" data-action="digit" data-value="3">3</button></td>
        <td rowspan="2"> <button type="button" class="btn btn-operator btn-plus" data-action="operator" data-value="+" aria-label="Sumar">+</button></td>
      </tr>

      <tr>
        <td> <button type="button" class="btn btn-digit" data-action="digit" data-value="0">0</button></td>
        <td> <button type="button" class="btn btn-digit" data-action="decimal">.</button></td>
        <td> <button type="button" class="btn btn-equals" data-action="equals" aria-label="Igual">=</button></td>
      </tr>

    </table>

  </main>

  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
