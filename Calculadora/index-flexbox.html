<!DOCTYPE html>
<html lang="es">

<head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora - Flexbox</title>
  <link rel="stylesheet" href="css/calculator-base.css">
  <link rel="stylesheet" href="css/calculator-flexbox.css">
</head>

<body>

  <main class="calculator">
    <div id="display" class="display" aria-live="polite">0</div>

    <div class="keypad">

      <div class="keypad-row">

        <button type="button" class="btn btn-action" data-action="clear-all">AC</button>
        <button type="button" class="btn btn-action" data-action="clear-entry">CE</button>
        <button type="button" class="btn btn-operator" data-action="percent" aria-label="Porcentaje">%</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="/" aria-label="Dividir">÷</button>

      </div>

      <div class="keypad-row">

        <button type="button" class="btn btn-digit" data-action="digit" data-value="7">7</button>
        <button type="button" class="btn btn-digit" data-action="digit" data-value="8">8</button>
        <button type="button" class="btn btn-digit" data-action="digit" data-value="9">9</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="*" aria-label="Multiplicar">×</button>

      </div>

      <div class="keypad-row">

        <button type="button" class="btn btn-digit" data-action="digit" data-value="4">4</button>
        <button type="button" class="btn btn-digit" data-action="digit" data-value="5">5</button>
        <button type="button" class="btn btn-digit" data-action="digit" data-value="6">6</button>
        <button type="button" class="btn btn-operator" data-action="operator" data-value="-" aria-label="Restar">-</button>

      </div>

    <div class="keypad-bottom">

    <div class="keypad-bottom-left">

        <div class="keypad-row">

            <button type="button" class="btn btn-digit" data-action="digit" data-value="1">1</button>
            <button type="button" class="btn btn-digit" data-action="digit" data-value="2">2</button>
            <button type="button" class="btn btn-digit" data-action="digit" data-value="3">3</button>

        </div>

        <div class="keypad-row">

            <button type="button" class="btn btn-digit" data-action="digit" data-value="0">0</button>
            <button type="button" class="btn btn-digit" data-action="decimal">.</button>
            <button type="button" class="btn btn-equals" data-action="equals" aria-label="Igual">=</button>

        </div>

        </div>

        <button type="button" class="btn btn-operator btn-plus" data-action="operator" data-value="+" aria-label="Sumar">+</button>

        </div>

      </div>

  </main>

  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
